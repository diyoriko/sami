<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAMI Backlog</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --text-muted: #8b949e;
    --accent: #58a6ff;
    --p0: #f85149;
    --p1: #d29922;
    --p2: #3fb950;
    --p3: #8b949e;
    --done: #238636;
    --done-bg: rgba(35,134,54,0.15);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
    max-width: 960px;
    margin: 0 auto;
    line-height: 1.5;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 32px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }

  h1 {
    font-size: 24px;
    font-weight: 600;
    letter-spacing: -0.5px;
  }

  .meta {
    font-size: 13px;
    color: var(--text-muted);
  }

  .meta .live {
    display: inline-block;
    width: 8px;
    height: 8px;
    background: var(--p2);
    border-radius: 50%;
    margin-right: 4px;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 32px;
  }

  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    text-align: center;
  }

  .stat-value {
    font-size: 28px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  .stat-label {
    font-size: 12px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-top: 4px;
  }

  .sprint {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 16px;
    overflow: hidden;
  }

  .sprint-header {
    padding: 16px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    user-select: none;
  }

  .sprint-header:hover {
    background: rgba(255,255,255,0.03);
  }

  .sprint-title {
    font-size: 16px;
    font-weight: 600;
  }

  .sprint-badge {
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 12px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .badge-active { background: rgba(88,166,255,0.15); color: var(--accent); }
  .badge-planned { background: rgba(139,148,158,0.15); color: var(--text-muted); }
  .badge-done { background: var(--done-bg); color: var(--done); }

  .sprint-body {
    padding: 0 20px 16px;
  }

  .group {
    margin-bottom: 16px;
  }

  .group:last-child {
    margin-bottom: 0;
  }

  .group-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .priority-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .task {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 8px 12px;
    border-radius: 6px;
    margin-bottom: 2px;
    font-size: 14px;
    transition: background 0.15s;
  }

  .task:hover {
    background: rgba(255,255,255,0.03);
  }

  .task-check {
    width: 18px;
    height: 18px;
    border-radius: 4px;
    border: 2px solid var(--border);
    flex-shrink: 0;
    margin-top: 1px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .task-done .task-check {
    background: var(--done);
    border-color: var(--done);
  }

  .task-done .task-check::after {
    content: '\2713';
    color: white;
    font-size: 12px;
    font-weight: 700;
  }

  .task-done .task-text {
    color: var(--text-muted);
    text-decoration: line-through;
    text-decoration-color: rgba(139,148,158,0.4);
  }

  .task-text strong {
    font-weight: 600;
  }

  .services {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-top: 24px;
  }

  .services h3 {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 12px;
  }

  .service-row {
    display: grid;
    grid-template-columns: 140px 1fr 120px;
    gap: 12px;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }

  .service-row:last-child {
    border-bottom: none;
  }

  .service-name {
    font-weight: 600;
  }

  .service-cost {
    text-align: right;
    color: var(--text-muted);
  }

  .service-cost.paid {
    color: var(--p1);
  }

  .done-section .sprint-body {
    max-height: 200px;
    overflow-y: auto;
  }

  .collapse-icon {
    transition: transform 0.2s;
    color: var(--text-muted);
  }

  .collapsed .collapse-icon {
    transform: rotate(-90deg);
  }

  .collapsed .sprint-body {
    display: none;
  }

  .progress-bar {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
    margin-top: 4px;
  }

  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 0.3s;
  }
</style>
</head>
<body>

<header>

</header>

<div class="stats" id="stats"></div>

        },

        },

        {

  services: [
    { name: 'Railway', desc: 'Хостинг бота 24/7, persistent volume', cost: '~$5/мес', paid: true },

    { name: 'YouTube API v3', desc: 'Поиск видео, метаданные', cost: 'Бесплатно', paid: false },

function getPriorityColor(p) {
  const map = { p0: 'var(--p0)', p1: 'var(--p1)', p2: 'var(--p2)', p3: 'var(--p3)' };
  return map[p] || 'var(--text-muted)';
}

function render() {
  // Stats
  const totalOpen = data.sprints.reduce((s, sp) => s + sp.groups.reduce((g, gr) => g + gr.tasks.filter(t => !t.done).length, 0), 0);
  const totalDone = data.done.length;
  const p0Count = data.sprints.reduce((s, sp) => s + sp.groups.filter(g => g.priority === 'p0').reduce((g, gr) => g + gr.tasks.filter(t => !t.done).length, 0), 0);
  const sprintCount = data.sprints.length;

  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="stat-value" style="color:var(--done)">${totalDone}</div><div class="stat-label">Сделано</div></div>
    <div class="stat"><div class="stat-value">${totalOpen}</div><div class="stat-label">Открыто</div></div>
    <div class="stat"><div class="stat-value" style="color:var(--p0)">${p0Count}</div><div class="stat-label">P0 критичных</div></div>
    <div class="stat"><div class="stat-value">${sprintCount}</div><div class="stat-label">Спринтов</div></div>
  `;

  // Sprints
  let html = '';

  // Done section
  html += `
    <div class="sprint done-section collapsed" onclick="this.classList.toggle('collapsed')">
      <div class="sprint-header">
        <span class="sprint-title">Сделано (${data.done.length})</span>
        <span class="collapse-icon">&#9660;</span>
      </div>
      <div class="sprint-body">
        ${data.done.map(t => `
          <div class="task task-done">
            <div class="task-check"></div>
            <span class="task-text">${t}</span>
          </div>
        `).join('')}
      </div>
    </div>
  `;

  // Active sprints
  for (const sprint of data.sprints) {
    const badgeClass = sprint.status === 'active' ? 'badge-active' : 'badge-planned';
    const badgeText = sprint.status === 'active' ? 'В работе' : 'Планируется';
    const total = sprint.groups.reduce((s, g) => s + g.tasks.length, 0);
    const done = sprint.groups.reduce((s, g) => s + g.tasks.filter(t => t.done).length, 0);
    const pct = total > 0 ? Math.round(done / total * 100) : 0;

    html += `
      <div class="sprint">
        <div class="sprint-header" onclick="this.parentElement.classList.toggle('collapsed')">
          <div>
            <span class="sprint-title">${sprint.name}</span>
            <div class="progress-bar" style="width:200px;margin-top:6px">
              <div class="progress-fill" style="width:${pct}%"></div>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:12px">
            <span style="font-size:13px;color:var(--text-muted)">${done}/${total}</span>
            <span class="sprint-badge ${badgeClass}">${badgeText}</span>
            <span class="collapse-icon">&#9660;</span>
          </div>
        </div>
        <div class="sprint-body">
          ${sprint.groups.map(g => `
            <div class="group">
              <div class="group-title">
                <span class="priority-dot" style="background:${getPriorityColor(g.priority)}"></span>
                ${g.priority.toUpperCase()}: ${g.title}
              </div>
              ${g.tasks.map(t => `
                <div class="task ${t.done ? 'task-done' : ''}">
                  <div class="task-check"></div>
                  <span class="task-text">${t.text}</span>
                </div>
              `).join('')}
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }

  document.getElementById('content').innerHTML = html;

  // Services
  document.getElementById('services').innerHTML = `
    <h3>Платные сервисы</h3>
    ${data.services.map(s => `
      <div class="service-row">
        <span class="service-name">${s.name}</span>
        <span>${s.desc}</span>
        <span class="service-cost ${s.paid ? 'paid' : ''}">${s.cost}</span>
      </div>
    `).join('')}
  `;

  document.getElementById('lastUpdate').textContent = new Date().toLocaleString('ru-RU', {
    hour: '2-digit', minute: '2-digit', second: '2-digit'
  });
}

render();
setInterval(render, REFRESH_INTERVAL);
</script>
</body>
</html>
