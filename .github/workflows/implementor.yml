name: Implementor Agent

on:
  # schedule disabled — needs ANTHROPIC_API_KEY for Claude Code CLI
  # schedule:
  #   - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      task_id:
        description: 'Specific task ID to implement (optional)'
        type: string
        required: false

env:
  COMMUNITY_AGENT_URL: https://courageous-happiness-production.up.railway.app

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Install project dependencies
        run: cd agents/community && npm ci

      - name: Fetch next task
        id: task
        env:
          IMPL_API_KEY: ${{ secrets.STRATEGIST_API_KEY }}
        run: |
          if [ -n "${{ inputs.task_id }}" ]; then
            TASK=$(curl -sf "$COMMUNITY_AGENT_URL/impl/tasks?status=approved" | python3 -c "
          import json,sys
          tasks = json.load(sys.stdin)
          t = next((t for t in tasks if t['id'] == ${{ inputs.task_id }}), None)
          print(json.dumps(t) if t else 'null')
          ")
          else
            TASK=$(curl -sf "$COMMUNITY_AGENT_URL/impl/next" | python3 -c "import json,sys; print(json.dumps(json.load(sys.stdin).get('task')))")
          fi

          if [ "$TASK" = "null" ] || [ -z "$TASK" ]; then
            echo "No approved tasks found"
            echo "has_task=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          TASK_ID=$(echo "$TASK" | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")
          TASK_TITLE=$(echo "$TASK" | python3 -c "import json,sys; print(json.load(sys.stdin)['title'])")
          echo "$TASK" | python3 -c "import json,sys; print(json.load(sys.stdin)['spec'])" > /tmp/task-spec.txt

          echo "has_task=true" >> $GITHUB_OUTPUT
          echo "task_id=$TASK_ID" >> $GITHUB_OUTPUT
          echo "task_title=$TASK_TITLE" >> $GITHUB_OUTPUT

      - name: Mark task in progress
        if: steps.task.outputs.has_task == 'true'
        env:
          IMPL_API_KEY: ${{ secrets.STRATEGIST_API_KEY }}
        run: |
          curl -sf -X POST "$COMMUNITY_AGENT_URL/impl/result" \
            -H "Content-Type: application/json" \
            -H "x-admin-token: $IMPL_API_KEY" \
            -d "{\"id\": ${{ steps.task.outputs.task_id }}, \"status\": \"in_progress\"}"

      - name: Create branch
        if: steps.task.outputs.has_task == 'true'
        id: branch
        run: |
          BRANCH="impl/task-${{ steps.task.outputs.task_id }}"
          git checkout -b "$BRANCH"
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

      - name: Run Claude Code
        if: steps.task.outputs.has_task == 'true'
        env:
          CLAUDE_AUTH_TOKEN: ${{ secrets.CLAUDE_AUTH_TOKEN }}
        run: |
          SPEC=$(cat /tmp/task-spec.txt)
          claude --print --model claude-sonnet-4-6 "
          Ты — имплементатор для проекта SAMI (Telegram fitness community bot).
          Проект: $(pwd)
          Задача: ${{ steps.task.outputs.task_title }}
          Спецификация:
          $SPEC

          Правила:
          - Прочитай CLAUDE.md для контекста
          - TypeScript, grammY, SQLite (better-sqlite3)
          - Запусти tsc --noEmit и vitest run после реализации
          - Минимальные изменения, не трогай то что не относится к задаче
          " > /tmp/implementation.log 2>&1 || true

          cat /tmp/implementation.log

      - name: Run checks
        if: steps.task.outputs.has_task == 'true'
        run: |
          cd agents/community
          npx tsc --noEmit
          npx vitest run

      - name: Commit and push
        if: steps.task.outputs.has_task == 'true'
        id: commit
        run: |
          git add -A
          CHANGES=$(git diff --cached --stat)
          if [ -z "$CHANGES" ]; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "SAMI Implementor"
          git config user.email "noreply@sami.bot"
          git commit -m "impl: ${{ steps.task.outputs.task_title }}

          Task #${{ steps.task.outputs.task_id }}
          Co-Authored-By: Claude Sonnet 4.6 <noreply@anthropic.com>"
          git push origin "${{ steps.branch.outputs.branch }}"
          SHA=$(git rev-parse HEAD)
          echo "commit_sha=$SHA" >> $GITHUB_OUTPUT

      - name: Report result
        if: always() && steps.task.outputs.has_task == 'true'
        env:
          IMPL_API_KEY: ${{ secrets.STRATEGIST_API_KEY }}
        run: |
          if [ "${{ steps.commit.outcome }}" = "success" ]; then
            STATUS="review"
            RESULT="Branch: ${{ steps.branch.outputs.branch }}, Commit: ${{ steps.commit.outputs.commit_sha }}"
          else
            STATUS="failed"
            RESULT="Implementation or checks failed. See workflow run #${{ github.run_number }}"
          fi

          curl -sf -X POST "$COMMUNITY_AGENT_URL/impl/result" \
            -H "Content-Type: application/json" \
            -H "x-admin-token: $IMPL_API_KEY" \
            -d "{
              \"id\": ${{ steps.task.outputs.task_id }},
              \"status\": \"$STATUS\",
              \"result\": \"$RESULT\",
              \"branch\": \"${{ steps.branch.outputs.branch }}\",
              \"commit_sha\": \"${{ steps.commit.outputs.commit_sha || '' }}\"
            }"
