name: Daily SQLite Backup

on:
  schedule:
    # 03:00 MSK = 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

env:
  COMMUNITY_AGENT_URL: https://courageous-happiness-production.up.railway.app

jobs:
  backup-sami:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Download SAMI database
        env:
          BACKUP_TOKEN: ${{ secrets.STRATEGIST_API_KEY }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          curl -sf --max-time 60 \
            -H "X-Admin-Token: $BACKUP_TOKEN" \
            "$COMMUNITY_AGENT_URL/backup" \
            -o "community-${DATE}.db"
          ls -lh "community-${DATE}.db"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: sami-backup-${{ github.run_number }}
          path: "*.db"
          retention-days: 30
